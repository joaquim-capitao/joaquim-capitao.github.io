<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contagens Decrescentes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #1a1926;
      --card-bg: #242336;
      --accent: #f26d1f;
      --text-main: #e6d9a1;
      --text-muted: #9e977d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Ubuntu', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 18px 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.3px;
    }

    .card-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }

    .time-box {
      background-color: var(--bg-color);
      border-radius: 8px;
      padding: 12px 6px;
    }

    .time-value {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-done {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-main);
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <div id="container"></div>

  <script>
    // Edita aqui as datas e horas exatas (Formato: AAAA-MM-DDTHH:MM:SS)
    const eventos = [
      {
        titulo: "Envio de Bens",
        data: "2026-12-01T00:00:00"
      },
      {
        titulo: "Nossa Viagem",
        data: "2026-12-15T00:00:00"
      },
      {
        titulo: "Início da Designação",
        data: "2027-01-01T00:00:00"
      }
    ];

    const container = document.getElementById("container");

    function formatarDataLegivel(isoString) {
      const d = new Date(isoString);
      return d.toLocaleDateString("pt-PT", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function criarEstrutura() {
      container.style.display = "flex";
      container.style.flexDirection = "column";
      container.style.gap = "16px";

      eventos.forEach((ev, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${ev.titulo}</span>
            <span class="card-date">${formatarDataLegivel(ev.data)}</span>
          </div>
          <div id="timer-${index}"></div>
        `;
        container.appendChild(card);
      });
    }

    function atualizarContagens() {
      const agora = new Date().getTime();

      eventos.forEach((ev, index) => {
        const alvo = new Date(ev.data).getTime();
        const diferenca = alvo - agora;
        const el = document.getElementById(`timer-${index}`);

        if (diferenca <= 0) {
          el.innerHTML = `<div class="status-done">Data atingida</div>`;
          return;
        }

        const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));

        el.innerHTML = `
          <div class="timer-grid">
            <div class="time-box">
              <div class="time-value">${dias}</div>
              <div class="time-label">${dias === 1 ? "Dia" : "Dias"}</div>
            </div>
            <div class="time-box">
              <div class="time-value">${String(horas).padStart(2, "0")}</div>
              <div class="time-label">${horas === 1 ? "Hora" : "Horas"}</div>
            </div>
            <div class="time-box">
              <div class="time-value">${String(minutos).padStart(2, "0")}</div>
              <div class="time-label">${minutos === 1 ? "Minuto" : "Minutos"}</div>
            </div>
          </div>
        `;
      });
    }

    criarEstrutura();
    atualizarContagens();
    setInterval(atualizarContagens, 10000);
  </script>
</body>
</html>
