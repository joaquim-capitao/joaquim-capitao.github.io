<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeos</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .video-item {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Contentor responsivo para manter a proporção 16:9 */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-description {
      font-size: 1rem;
      color: #cbd5e1;
      padding: 0 0.25rem;
    }

    hr.divider {
      border: 0;
      height: 1px;
      background: #334155;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Primeiro Vídeo -->
    <div class="video-item">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/Z6oeAdemFZw" 
          title="Reprodutor de vídeo YouTube 1" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>
      <p class="video-description">O inspetor francês Clouseau contrata uma professora para aprender a pronunciar palavras em inglês. - The Pink Panther (2006)</p>
      <hr class="divider">
    </div>

    <!-- Segundo Vídeo -->
    <div class="video-item">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/SXP3etiFgjY" 
          title="Reprodutor de vídeo YouTube 2" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>
      <p class="video-description">A dança - Get Smart (2008)</p>
      <hr class="divider">
    </div>

    <!-- Terceiro Vídeo -->
    <div class="video-item">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/TkdbqK4iUsU"
          title="Reprodutor de vídeo YouTube 3" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin" 
          allowfullscreen>
        </iframe>
      </div>
      <p class="video-description">A cena do avião. Hot Shots! (1991)  (</p>
    </div>

    
  </main>

</body>
</html>
