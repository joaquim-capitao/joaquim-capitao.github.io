<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria</title>
  
  <style>
    /* Paleta baseada no tema escuro */
    :root {
      --bg-principal: #1a1926;
      --bg-card: #232234;
      --cor-destaque: #f9572a;
      --cor-acento: #6c82ff;
      --texto-claro: #f0f0f5;
      --texto-secundario: #b5b3c2;
      --borda-card: #2f2d42;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-principal);
      color: var(--texto-claro);
      margin: 0;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      color: var(--cor-destaque);
      font-size: 2.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0 0 0.5rem 0;
    }

    header p {
      color: var(--texto-secundario);
      font-size: 1rem;
      margin: 0;
    }

    /* Grelha Responsiva */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Cartão da Imagem */
    .galeria-item {
      margin: 0;
      background: var(--bg-card);
      border: 1px solid var(--borda-card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .galeria-item:hover {
      transform: translateY(-4px);
      border-color: var(--cor-acento);
      box-shadow: 0 8px 24px rgba(108, 130, 255, 0.15);
    }

    .galeria-item img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background-color: #12111a;
    }

    .galeria-item figcaption {
      padding: 1rem;
      font-size: 0.95rem;
      color: var(--texto-secundario);
      text-align: center;
      transition: color 0.2s ease;
    }

    .galeria-item:hover figcaption {
      color: var(--cor-acento);
    }

    /* Modal / Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background-color: rgba(15, 14, 23, 0.94);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 1.5rem;
    }

    .lightbox.ativo {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      border: 1px solid var(--borda-card);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .lightbox p {
      color: var(--texto-claro);
      margin-top: 1.2rem;
      font-size: 1.05rem;
      letter-spacing: 0.3px;
    }

    .lightbox .fechar {
      position: absolute;
      top: 20px;
      right: 30px;
      color: var(--texto-secundario);
      font-size: 2.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .lightbox .fechar:hover {
      color: var(--cor-destaque);
    }
  </style>
</head>
<body>

  <header>
    <h1>Galeria</h1>
    <p>(Registos visuais e ilustrações)</p>
  </header>

  <main>
    <div class="galeria-grid">
      <!-- Exemplo 1 -->
      <figure class="galeria-item">
        <img src="imagens/foto2.jpg" alt="Descrição da foto 1" loading="lazy">
        <figcaption>Descrição 1</figcaption>
      </figure>

      <!-- Exemplo 2 -->
      <figure class="galeria-item">
        <img src="imagens/foto2.jpg" alt="Descrição da foto 2" loading="lazy">
        <figcaption>Descrição 2</figcaption>
      </figure>

      <!-- Exemplo 3 -->
      <figure class="galeria-item">
        <img src="imagens/foto3.jpg" alt="Descrição da foto 3" loading="lazy">
        <figcaption>Descrição 3</figcaption>
      </figure>
    </div>
  </main>

  <!-- Janela de Ampliação (Lightbox) -->
  <div id="lightbox" class="lightbox" onclick="fecharLightbox()">
    <span class="fechar">&times;</span>
    <img id="lightbox-img" src="" alt="Imagem ampliada">
    <p id="lightbox-legenda"></p>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxLegenda = document.getElementById('lightbox-legenda');

    // Abre o lightbox ao clicar no item
    document.querySelectorAll('.galeria-item').forEach(item => {
      item.addEventListener('click', () => {
        const img = item.querySelector('img');
        const legenda = item.querySelector('figcaption');

        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightboxLegenda.textContent = legenda ? legenda.textContent : '';
        lightbox.classList.add('ativo');
      });
    });

    // Fecha o lightbox
    function fecharLightbox() {
      lightbox.classList.remove('ativo');
    }

    // Fecha ao premir a tecla Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('ativo')) {
        fecharLightbox();
      }
    });
  </script>
</body>
</html>
