<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foco!</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Alinha os elementos na vertical */
            justify-content: center;
            align-items: center;
            background-color: #0b192c; /* Azul escuro profundo */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            gap: 20px; /* Dá um espaço confortável entre a pergunta e o texto de baixo */
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 3.5rem;
            color: #ff6b00; /* Laranja vibrante */
            font-weight: 900; /* Negrito extra forte */
            text-align: center;
            margin: 0;
        }
        p {
            font-size: 19px; /* Tamanho intermédio entre 18px e 20px */
            color: #ff8533; /* Um laranja ligeiramente mais suave para o texto secundário */
            text-align: center;
            margin: 0;
        }
        a {
            color: #ffffff; /* Link em branco para destacar bem */
            font-weight: bold;
            text-decoration: underline;
        }
        a:hover {
            color: #ff6b00; /* O link fica laranja quando passa o rato por cima */
        }
    </style>
</head>
<body>

    <h1>Não devias estar a trabalhar?</h1>
    <p>Se quiseres ler uma coisa que parece um blogue, clica <a href="https://joaquim-capitao.github.io/queime-depois-de-ler/index" target="_blank">aqui</a>.</p>

</body>
</html>
