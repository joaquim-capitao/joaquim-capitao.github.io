<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Música</title>
  
  <!-- Fonte Ubuntu do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Cores baseadas no design da página */
      --bg: #1c1b24; /* Fundo escuro azulado/acinzentado */
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-hover-border: rgba(243, 112, 34, 0.4);
      --card-hover-bg: rgba(243, 112, 34, 0.05);
      
      --accent: #f37022; /* Laranja dos títulos */
      --text-link: #7a8add; /* Azul suave dos links */
      --text-date: #c8b975; /* Amarelado das datas e subtítulo */
      
      --accent-glow: rgba(243, 112, 34, 0.15);
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Ubuntu', sans-serif;
      background-color: var(--bg);
      color: var(--text-link);
      min-height: 100vh;
      line-height: 1.5;
      padding: 30px 20px 40px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Barra Superior com o Link de Retorno */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 24px;
    }

    .nav-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      color: var(--text-date);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-home-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .nav-home-btn:hover {
      color: var(--accent);
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      transform: translateX(-2px);
      box-shadow: 0 4px 14px -2px var(--accent-glow);
    }

    .nav-home-btn:hover svg {
      transform: translateX(-2px);
    }

    header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }
 
    .subtitle {
      color: var(--text-date);
      font-size: 1rem;
      font-weight: 400;
    }

    .chronicles-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chronicles-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chronicles-list a:hover {
      transform: translateY(-2px);
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      box-shadow: 0 8px 24px -4px var(--accent-glow);
    }

    .chronicles-list .title {
      color: var(--text-link);
      font-weight: 400;
      font-size: 1.1rem;
    }

    .chronicles-list .date {
      color: var(--text-date);
      font-size: 0.9rem;
      font-weight: 400;
      white-space: nowrap;
      margin-left: 16px;
    }

    /* Paginação */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--card-border);
    }

    .page-btn {
      background-color: transparent;
      border: 1px solid transparent;
      color: var(--text-link);
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      color: var(--accent);
    }

    .page-btn.active {
      background-color: var(--card-bg);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
    }

    .footer-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-date);
      font-size: 0.85rem;
      opacity: 0.7;
      transition: all 0.2s ease;
    }

    .footer-home-btn:hover {
      opacity: 1;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- Botão Elegante no Início -->
    <nav class="top-nav" aria-label="Navegação Superior">
      <a href="https://joaquim-capitao.github.io/" class="nav-home-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Página Inicial</span>
      </a>
    </nav>

    <header>
      <h1 id="musica">Música</h1>
    </header>
    
    <ul class="chronicles-list" id="chronicles-list">

     <li><a href="https://joaquim-capitao.github.io/musica/generos"><span class="title">Linhagens Sonoras</span></a></li>
     <li><a href="https://joaquim-capitao.github.io/musica/em-construcao"><span class="title">As Melhores Músicas de Sempre</span></a></li>
     <li><a href="https://joaquim-capitao.github.io/musica/em-construcao"><span class="title">Guitarra (O que já aprendi)</span></a></li>


    </ul>

    <!-- Navegação de Páginas -->
    <nav class="pagination" id="pagination" aria-label="Navegação das crónicas"></nav>

    <footer>
      <a href="https://joaquim-capitao.github.io/" class="footer-home-btn" title="Página Inicial">
        <span>← Voltar à Página Inicial</span>
      </a>
    </footer>

  </main>

  <script>
    const ITEMS_PER_PAGE = 100;
    const list = document.getElementById('chronicles-list');
    const items = Array.from(list.children);
    const paginationContainer = document.getElementById('pagination');
    const totalPages = Math.ceil(items.length / ITEMS_PER_PAGE);

    function showPage(page) {
      const start = (page - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;

      items.forEach((item, index) => {
        item.style.display = (index >= start && index < end) ? '' : 'none';
      });

      renderPagination(page);
    }

    function renderPagination(currentPage) {
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      paginationContainer.innerHTML = '';

      // Botão Anterior
      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = '← Anterior';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => {
        showPage(currentPage - 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      paginationContainer.appendChild(prevBtn);

      // Botões numéricos
      for (let i = 1; i <= totalPages; i++) {
        const numBtn = document.createElement('button');
        numBtn.className = 'page-btn' + (i === currentPage ? ' active' : '');
        numBtn.textContent = i;
        numBtn.onclick = () => {
          showPage(i);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationContainer.appendChild(numBtn);
      }

      // Botão Seguinte
      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = 'Seguinte →';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => {
        showPage(currentPage + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      paginationContainer.appendChild(nextBtn);
    }

    // Inicialização na primeira página
    showPage(1);
  </script>

</body>
</html>
